<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - Appliance Energy Consumption</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="container my-5">
    <h2 class="mb-4">Interactive Appliance Energy Calculator</h2>

    <div class="row g-4">
      <div class="col-md-6">
        <form id="calculator-form" class="card p-4 shadow-sm">
          <div class="mb-3">
            <label for="wattage" class="form-label">Appliance Power (Watts)</label>
            <input type="number" id="wattage" class="form-control" placeholder="e.g. 100" required min="1">
          </div>
          <div class="mb-3">
            <label for="hours" class="form-label">Average Daily Usage (Hours)</label>
            <input type="number" id="hours" class="form-control" placeholder="e.g. 5" step="0.1" required min="0.1" max="24">
          </div>
          <div class="mb-3">
            <label for="rate" class="form-label">Electricity Tariff (Cents per kWh)</label>
            <input type="number" id="rate" class="form-control" value="30" step="0.1" required min="0">
          </div>
          <button type="submit" class="btn btn-primary w-100">Calculate Energy</button>
        </form>
      </div>

      <div class="col-md-6">
        <div id="calc-error" class="alert alert-danger d-none" role="alert"></div>

        <div id="calc-results" class="card p-4 shadow-sm bg-body-tertiary d-none">
          <h4 class="card-title mb-3">Estimated Consumption</h4>
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between">
              <span>Daily Usage:</span> <strong id="res-daily-kwh">0 kWh</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Monthly Usage:</span> <strong id="res-monthly-kwh">0 kWh</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span>Estimated Yearly Cost:</span> <strong class="fs-5 text-success" id="res-yearly-cost">$0.00</strong>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/calculator.js"></script>
</body>
</html>
